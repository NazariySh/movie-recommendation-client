<h2 mat-dialog-title>{{ 'ADMIN.USERS.EDIT_ROLES' | translate }} — {{ data.username }}</h2>
<mat-dialog-content>
  <div class="role-list">
    <mat-checkbox *ngFor="let r of data.available"
                  [checked]="isChecked(r)"
                  (change)="toggle(r, $event.checked)">
      {{ r }}
    </mat-checkbox>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
  <button mat-flat-button color="primary" (click)="save()">{{ 'COMMON.SAVE' | translate }}</button>
</mat-dialog-actions>
