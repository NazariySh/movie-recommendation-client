<form class="change-pwd" [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-input-password
    class="change-pwd__field"
    [control]="form.get('currentPassword')"
    [label]="'PROFILE.CURRENT_PASSWORD' | translate"
    autocomplete="current-password">
  </app-input-password>

  <app-input-password
    class="change-pwd__field"
    [control]="form.get('newPassword')"
    [label]="'AUTH.NEW_PASSWORD' | translate"
    autocomplete="new-password">
  </app-input-password>

  <app-password-strength-meter [password]="form.get('newPassword')?.value || ''"></app-password-strength-meter>

  <app-input-password
    class="change-pwd__field"
    [control]="form.get('confirmPassword')"
    [label]="'AUTH.CONFIRM_PASSWORD' | translate"
    [errorMessage]="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched ? ('AUTH.ERROR.PASSWORD_MISMATCH' | translate) : null"
    autocomplete="new-password">
  </app-input-password>

  <div class="change-pwd__actions">
    <app-button buttonType="raised" color="primary" type="submit" [disabled]="form.invalid || submitting">
      {{ (submitting ? 'COMMON.LOADING' : 'PROFILE.CHANGE_PASSWORD') | translate }}
    </app-button>
  </div>
</form>
