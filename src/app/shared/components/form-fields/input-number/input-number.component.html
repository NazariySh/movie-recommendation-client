<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    type="number"
    [formControl]="formControl"
    [placeholder]="placeholder"
    [attr.min]="min"
    [attr.max]="max"
    [attr.step]="step"
    [errorStateMatcher]="this">
  <mat-error>{{ displayError }}</mat-error>
</mat-form-field>
