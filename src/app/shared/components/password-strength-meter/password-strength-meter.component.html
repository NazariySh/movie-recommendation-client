<div class="strength" *ngIf="password">
  <div class="strength__bar strength__bar--{{ level }}">
    <span [style.width.%]="(score / 5) * 100"></span>
  </div>
  <ul class="strength__rules">
    <li *ngFor="let rule of rules" [class.satisfied]="rule.satisfied">
      <span class="strength__check">{{ rule.satisfied ? '✓' : '○' }}</span>
      {{ rule.key | translate }}
    </li>
  </ul>
</div>
