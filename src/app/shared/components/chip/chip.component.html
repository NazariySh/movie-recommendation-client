<span
  class="app-chip"
  [class.app-chip--clickable]="clickable"
  [class.app-chip--active]="active"
  [class.app-chip--disabled]="disabled"
  [class.app-chip--sm]="size === 'sm'"
  [class.app-chip--outline]="variant === 'outline'"
  [class.app-chip--ghost]="variant === 'ghost'"
  [attr.role]="clickable ? 'button' : null"
  [attr.tabindex]="clickable && !disabled ? 0 : null"
  (click)="onChipClick()"
  (keydown.enter)="onChipClick()"
  (keydown.space)="onChipClick()">

  <mat-icon *ngIf="icon" class="app-chip__icon" aria-hidden="true">{{ icon }}</mat-icon>

  <span class="app-chip__label">{{ label | translate }}</span>

  <span *ngIf="badge !== undefined && badge !== null && badge !== ''" class="app-chip__badge">{{ badge }}</span>

  <button
    *ngIf="removable"
    type="button"
    class="app-chip__remove"
    [disabled]="disabled"
    [attr.aria-label]="'COMMON.REMOVE' | translate"
    (click)="onRemoveClick($event)">
    ×
  </button>
</span>
